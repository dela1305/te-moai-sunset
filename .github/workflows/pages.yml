name: Deploy Pages

on:
  push:
    branches: [main, rediseno-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout rediseno-v2
        uses: actions/checkout@v4
        with:
          ref: rediseno-v2
          path: site-v2

      - name: Assemble combined site
        run: |
          mkdir -p dist
          cp -r site-v2/. dist/
          rm -rf dist/.git dist/.github
          echo "www.temoaisunset.com" > dist/CNAME
          mkdir -p dist/v1
          cp -r site-main/. dist/v1/
          rm -rf dist/v1/.git dist/v1/.github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
